<!-- templates/tienda.html -->
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kaistore • Demo</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    /* estilos mínimos por si tu style.css no cubre algo */
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; margin:0; background:#fafafa; color:#111 }
    header { display:flex; gap:12px; align-items:center; padding:14px 16px; background:#fff; position:sticky; top:0; z-index:10; border-bottom:1px solid #eee }
    .brand { font-weight:700; color:#1d4ed8 }
    .subtle { color:#6b7280; font-weight:500 }
    .search { margin-left:auto }
    .search input { border:1px solid #e5e7eb; border-radius:999px; padding:10px 14px; outline:none; width:220px; }
    main { max-width:1024px; margin:20px auto; padding:0 16px }
    .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap:18px }
    .grid-empty { text-align:center; color:#6b7280; padding:40px 8px }
    .card { border:1px solid #e5e7eb; border-radius:14px; overflow:hidden; background:#fff; display:flex; flex-direction:column }
    .card-img { width:100%; aspect-ratio:16/9; object-fit:cover }
    .card-body { padding:14px }
    .card-title { margin:0 0 6px; font-size:16px }
    .card-desc { margin:0 0 10px; color:#6b7280; font-size:13px; min-height:18px }
    .card-price { font-weight:700; margin-bottom:10px }
    .btn-primary { background:#155eef; color:#fff; border:none; border-radius:10px; padding:10px 12px; width:100%; cursor:pointer }
    .btn-primary:disabled { opacity:.6; cursor:not-allowed }
    footer { text-align:center; color:#9ca3af; padding:32px 0 }
  </style>
</head>
<body>
  <header>
    <div class="brand">Kaistore</div>
    <div class="subtle">• Demo</div>
    <div class="search">
      <input placeholder="Buscar productos…" aria-label="Buscar productos">
    </div>
  </header>

  <main>
    <div id="products" class="grid">
      <!-- acá se renderizan las cards -->
    </div>
  </main>

  <footer>Sandbox • Pagos de prueba en Stripe</footer>

  <script defer src="/static/app.js"></script>
</body>
</html>
