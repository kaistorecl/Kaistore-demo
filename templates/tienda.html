<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kaistore • Demo</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    /* mínimos por si tu CSS tarda */
    .container{max-width:1080px;margin:0 auto;padding:16px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
    .card{border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;background:#fff}
    .card img{width:100%;height:200px;object-fit:cover}
    .card .bx{padding:12px}
    .btn{display:block;width:100%;padding:12px;border-radius:8px;border:none;cursor:pointer;background:#0b63e6;color:#fff;font-weight:600}
    .muted{color:#6b7280;text-align:center;margin-top:32px}
    header{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid #eee}
    .brand{font-weight:700}
    .search{flex:1;max-width:320px;padding:8px 10px;border:1px solid #ddd;border-radius:8px}
    footer{padding:40px 0;color:#6b7280;text-align:center}
  </style>
</head>
<body>
  <header>
    <div class="brand"><span style="color:#16a34a">●</span> Kaistore • Demo</div>
    <input id="q" class="search" placeholder="Buscar productos…" />
  </header>

  <main class="container">
    <div id="products" class="grid"></div>
    <p id="empty" class="muted" style="display:none">No hay productos publicados todavía 👋</p>
  </main>

  <footer>Sandbox • Pagos de prueba en Stripe • <b>v16</b></footer>

  <script>window.__APP_VERSION__ = 16;</script>
  <script src="/static/app.js?v=16"></script>
</body>
</html>
